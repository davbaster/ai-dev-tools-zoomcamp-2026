<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HostBoard</title><style>
:root{--ink:#2d2422;--paper:#fbf8f1;--linen:#f4efe5;--line:#d9cfc0;--sage:#4f7663;--sagep:#dfece4;--brass:#b36d25;--brassp:#f4e3c5;--tomato:#a94d3b;--tomatop:#f5dfda;--plum:#372a31}*{box-sizing:border-box}body{margin:0;background:var(--linen);color:var(--ink);font:14px system-ui,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{padding:24px 14px;border-right:1px solid var(--line)}.brand,h1,h2{font-family:Georgia,serif}.brand{font-size:24px;font-weight:bold;margin:0 9px 28px}.brand i{font-style:normal;background:var(--plum);color:white;border-radius:50%;padding:3px 9px;margin-right:7px}nav{display:grid;gap:4px}button{font:inherit;cursor:pointer}.nav,.profile{border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;font-weight:700}.nav.active,.nav:hover{background:var(--paper)}.profile{margin-top:30px;width:100%;border-top:1px solid var(--line);padding-top:20px}.main{min-width:0}.bar{display:flex;justify-content:space-between;align-items:center;padding:22px 36px;border-bottom:1px solid var(--line)}.bar small,.eyebrow{display:block;text-transform:uppercase;letter-spacing:1px;color:#806f67;font-size:10px;font-weight:800}.bar b{font:20px Georgia,serif}.primary{background:var(--plum);color:white;border:0;border-radius:7px;padding:10px 14px;font-weight:800}.page{padding:36px;max-width:1300px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}h1{font-size:36px;margin:4px 0}.sub{color:#6b5b55}.floor{display:grid;grid-template-columns:1fr 320px;gap:20px}.card{background:rgba(251,248,241,.72);border:1px solid var(--line);border-radius:12px;padding:20px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:22px 0}.table{aspect-ratio:1;border-radius:50%;border:1px solid transparent;background:var(--sagep);font-weight:800}.table.reserved{background:var(--brassp)}.table.occupied{background:var(--tomatop)}.table.selected{background:var(--plum);color:white;box-shadow:0 0 0 3px var(--brassp)}.ticket{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.ticket button{border:0;background:none;text-align:left;flex:1}.pill{border-radius:12px;padding:4px 7px;font-size:10px;font-weight:800;background:var(--brassp)}.warning{background:var(--brassp);border-left:3px solid var(--brass);padding:10px;margin:12px 0;font-size:12px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:90px 1fr 100px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#2d242277;display:grid;place-items:center;padding:18px}.dialog{width:min(470px,100%);background:var(--paper);padding:24px;border-radius:12px}.dialog label{display:grid;gap:5px;margin:10px 0;font-size:12px;font-weight:700}.dialog input,.dialog select{padding:10px;border:1px solid var(--line);border-radius:7px}.dialog .actions{display:flex;justify-content:end;gap:8px;margin-top:18px}.secondary{border:1px solid var(--line);background:var(--paper);padding:9px 12px;border-radius:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:var(--plum);color:white;border-radius:10px}.stat strong{display:block;font:28px Georgia,serif;margin-top:8px}.team{display:grid;gap:8px}.team article{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.team article button{margin-left:auto}.toast{position:fixed;right:20px;bottom:20px;background:var(--plum);color:white;padding:12px 16px;border-radius:8px}@media(max-width:760px){.shell{display:block}.side{display:flex;gap:5px;overflow:auto;padding:12px;border-bottom:1px solid var(--line)}.brand{display:none}.profile{margin:0;border:0;padding:10px}.nav{white-space:nowrap}.bar,.page{padding:20px}.floor{grid-template-columns:1fr}.map{gap:9px}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:60px 1fr 70px}}
</style></head><body><div id="app"></div><script>
const db={user:{name:'Marina Cruz',role:'host'},entries:[{id:1,name:'The Morales',size:2,phone:'555-0184',request:'High chair',status:'waiting',tables:[]},{id:2,name:'Samir Patel',size:2,phone:'555-0197',request:'Quiet corner',status:'seated',tables:[2]}],tables:[2,2,4,4,4,6,2,4,6,2].map((capacity,i)=>({id:i+1,capacity,status:i==1?'occupied':i==3?'reserved':'available'})),staff:[['Marina Cruz','host'],['Evan Lee','server'],['Ari Bennett','manager']]};let page='floor',selected=1,chosen=new Set(),toast='';const $=s=>document.querySelector(s);const api={async data(){return structuredClone(db)},async signIn(role){db.user={name:role==='manager'?'Ari Bennett':role==='server'?'Evan Lee':'Marina Cruz',role}},async add(x){db.entries.unshift({id:Date.now(),status:'waiting',tables:[],...x})},async seat(){let e=db.entries.find(x=>x.id===selected);e.status='seated';e.tables=[...chosen];e.tables.forEach(id=>db.tables[id-1].status='occupied')},async ready(id){db.tables[id-1].status='available'},async reserve(x){await this.add({...x,reservation:true});}};function note(t){toast=t;render();setTimeout(()=>{toast='';render()},1800)}function nav(){return ['floor','waitlist','reservations','reports','team'].filter(x=>db.user.role==='manager'||!['reports','team'].includes(x)).map(x=>`<button class="nav ${page===x?'active':''}" onclick="page='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}function map(){let e=db.entries.find(x=>x.id===selected);let cap=[...chosen].reduce((a,id)=>a+db.tables[id-1].capacity,0);return `<section class="floor"><div class="card"><span class="eyebrow">Live service · ${db.tables.filter(t=>t.status==='available').length} open</span><h1>Dining room</h1><div class="map">${db.tables.map(t=>`<button ${t.status!=='available'?'disabled':''} onclick="toggle(${t.id})" class="table ${t.status} ${chosen.has(t.id)?'selected':''}">${String(t.id).padStart(2,'0')}<small>${t.capacity} seats</small></button>`).join('')}</div></div><aside class="card"><span class="eyebrow">Next to seat</span><h2>${e?.name||'Choose a party'}</h2>${e?`<p>${e.size} guests · ${e.request}</p><p>Selected: ${[...chosen].join(', ')||'none'} (${cap} seats)</p>${chosen.size&&cap<e.size?'<div class="warning">Capacity warning — you can still continue.</div>':''}<button class="primary" onclick="seat()">Seat party</button>`:''}<hr>${db.entries.filter(e=>e.status==='waiting').map(e=>`<div class="ticket"><button onclick="selected=${e.id};chosen=new Set(e.tables);render()"><b>${e.name}</b><small>${e.size} guests</small></button><span class="pill">Waiting</span></div>`).join('')}</aside></section>`}function list(res=false){let rows=db.entries.filter(e=>!!e.reservation===res);return `<div class="head"><div><span class="eyebrow">Live service</span><h1>${res?'Reservations':'Waitlist'}</h1></div><button class="primary" onclick="openForm(${res})">New ${res?'reservation':'party'}</button></div><input oninput="filter=this.value;render()" placeholder="Search name or phone" style="padding:10px;width:100%;max-width:320px;margin-bottom:14px"><div class="list">${rows.filter(e=>`${e.name} ${e.phone}`.toLowerCase().includes((window.filter||'').toLowerCase())).map(e=>`<div class="row"><span>${e.reservation?'Booked':'Now'}</span><b>${e.name}<small> · ${e.size} guests</small></b><span class="pill">${e.status}</span></div>`).join('')||'<p>No matching parties.</p>'}</div>`}function reports(){return `<h1>Service report</h1><div class="stats">${[['Covers seated',db.entries.filter(e=>e.status==='seated').reduce((a,e)=>a+e.size,0)],['Avg. wait','18 min'],['Table turns','1.8x'],['Lost parties',db.entries.filter(e=>e.status==='cancelled').length]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div>`}function team(){return `<div class="head"><h1>Your team</h1><button class="primary" onclick="note('Mock staff account created.')">Add staff</button></div><div class="team">${db.staff.map(([n,r])=>`<article><b>${n}</b><span>${r}</span><button class="secondary" onclick="note('Mock account status updated.')">Manage</button></article>`).join('')}</div>`}function render(){let content=page==='floor'?map():page==='waitlist'?list():page==='reservations'?list(true):page==='reports'?reports():team();$('#app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><i>H</i>HostBoard</div><nav>${nav()}</nav><button class="profile" onclick="cycle()">${db.user.name}<br><small>${db.user.role} · switch preview</small></button></aside><main class="main"><header class="bar"><div><small>Juniper & Ash</small><b>Dinner service</b></div><button class="primary" onclick="openForm(false)">+ New party</button></header><section class="page">${content}</section></main></div>${toast?`<div class="toast">${toast}</div>`:''}`}function toggle(id){chosen.has(id)?chosen.delete(id):chosen.add(id);render()}async function seat(){await api.seat();chosen.clear();note('Party seated. Tables are occupied.')}function cycle(){let roles=['host','server','manager'],next=roles[(roles.indexOf(db.user.role)+1)%3];api.signIn(next).then(()=>{page='floor';note('Previewing '+next)})}function openForm(res){let d=document.createElement('div');d.className='modal';d.innerHTML=`<form class="dialog"><h2>New ${res?'reservation':'party'}</h2><label>Party name<input name="name" required></label><label>Party size<input name="size" type="number" min="1" value="2" required></label><label>Phone<input name="phone" required></label><label>Special request<input name="request" value="None" required></label>${res?'<label>Reservation time<input type="time" required></label>':''}<div class="actions"><button type="button" class="secondary">Cancel</button><button class="primary">Save</button></div></form>`;d.querySelector('[type=button]').onclick=()=>d.remove();d.querySelector('form').onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.size=+x.size;res?await api.reserve(x):await api.add(x);d.remove();note(res?'Reservation created.':'Party added.');};document.body.append(d)}render();
</script></body></html>
